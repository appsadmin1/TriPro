[build]
# Build both the functions and the web application
# 1. Install dependencies for the serverless functions
# 2. Install dependencies for the React web app
# 3. Build the React web app
command = "npm install --prefix netlify/functions && npm install --prefix web && npm run build --prefix web"
publish = "web/dist"
functions = "netlify/functions"

[dev]
command = "npm run dev --prefix web"
port = 8888
targetPort = 5173
publish = "web/dist"
autoLaunch = true

[functions]
node_bundler = "esbuild"

# Redirect all requests to index.html for React Router (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
